<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div class="sidebar">
        <a href="#"><i class="fas fa-home"></i> Dashboard</a>
        <a href="#"><i class="fas fa-box"></i> Voorraad</a>
        <a href="#"><i class="fas fa-shopping-cart"></i> Inkoop</a>
        <a href="#"><i class="fas fa-user"></i> Klant</a>
        <a href="#"><i class="fas fa-truck"></i> Koeriers</a>
    </div>

    <div class="main-content">
        <!-- Bijna op -->
        <div class="card">
            <h2>Bijna op</h2>
            <table class="table">
                <tr>
                    <th>ID</th>
                    <th>Product</th>
                    <th>Voorraad</th>
                </tr>
                <tr>
                    <td>00001</td>
                    <td>Banaan</td>
                    <td>2</td>
                </tr>
                <tr>
                    <td>00002</td>
                    <td>Appel</td>
                    <td>5</td>
                </tr>
                <tr>
                    <td>00003</td>
                    <td>Komkommer</td>
                    <td>3</td>
                </tr>
            </table>
            <button class="button">Inkoop</button>
        </div>

        <!-- CO2 Tracker -->
        <div class="card">
            <h2>CO2 Tracker</h2>
            <p>150 Km</p>
            <p>1.2 Ton CO2</p>
            <h3>Spoedbestellingen</h3>
            <p>50 Km</p>
            <p>0.5 Ton CO2</p>
        </div>

        <!-- Vernietigde producten -->
        <div class="card">
            <h2>Tot 01-01-2024</h2>
            <p>15 producten vernietigd</p>
            <button class="button">Meer</button>
        </div>

        <!-- Tijd en datum -->
        <div class="card time-card">
            <div class="clock">12:00</div>
            <div class="date">Maandag<br>01-01-2024</div>
        </div>

        <!-- Placeholder voor andere kaarten -->
        <div class="card">
            <h2>Placeholder</h2>
            <p>Extra inhoud hier.</p>
        </div>
    </div>
</body>
</html>
