{% extends 'base.html' %} {% block title %} Voorraad {% endblock %} {% block head %}
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
<link rel="stylesheet" href="{{ url_for('static', filename='css/voorraadToevoegen.css') }}" />
{% endblock %} {% block content %}
<div class="container mt-5">
  <h1 class="text-center alignH1">Voorraad Toevoegen</h1>

  <form method="POST" action="{{ url_for('views.voorraadToevoegen') }}" class="needs-validation" novalidate>
    <!-- <div class="mb-3">
      <label for="id" class="form-label">ID</label>
      <input type="number" class="form-control" id="id" name="id" placeholder="Bijv. 5" required min="1" />
      <div class="invalid-feedback"> Vul een geldig ID in. </div>
    </div> -->

    <!-- <div class="mb-3">
      <label for="product" class="form-label">Product</label>
      <input type="text" class="form-control" id="product" name="product" placeholder="Bijv. Mango" required />
      <div class="invalid-feedback"> Vul een productnaam in. </div>
    </div> -->

    <div class="mb-3">
      <label for="product" class="form-label">Product</label>
      <select class="form-select" id="Product" name="product" required>
        <option value="" selected disabled>Kies een product</option>
        <option value="1">Mango</option>
        <option value="2">Koffie</option>
        <option value="3">Melk</option>
      </select>
      <div class="invalid-feedback"> Selecteer een product. </div>
    </div>

    <div class="mb-3">
      <label for="batchnumber" class="form-label">Batchnummer</label>
      <input type="text" class="form-control" id="batchnumber" name="batchnumber" placeholder="Bijv. BATCH001" required />
      <div class="invalid-feedback"> Vul een batchnummer in. </div>
    </div>

    <div class="mb-3">
      <label for="storageadvice" class="form-label">Bewaaradvies</label>
      <select class="form-select" id="storageadvice" name="storageadvice" required>
        <option value="" selected disabled>Kies een bewaaradvies</option>
        <option value="Koeling">Koeling</option>
        <option value="Droog en donker">Droog en donker</option>
        <option value="Gekoeld bewaren">Gekoeld bewaren</option>
      </select>
      <div class="invalid-feedback"> Selecteer een bewaaradvies. </div>
    </div>

    <!-- <div class="mb-3">
      <label for="location" class="form-label">Locatie</label>
      <input type="text" class="form-control" id="location" name="location" placeholder="Bijv. A12" required />
      <div class="invalid-feedback"> Vul een locatie in. </div>
    </div> -->
    <div class="mb-3">
      <label for="Locatie" class="form-label">Locatie</label>
      <select class="form-select" id="Product" name="product" required>
        <option value="" selected disabled>Kies een locatie</option>
        <option value="1">Tilburg DC</option>
        <option value="2">Eindhoven DC</option>
        <option value="3">Breda DC</option>
      </select>
      <div class="invalid-feedback"> Selecteer een locatie. </div>
    </div>

    <div class="mb-3">
      <label for="amount" class="form-label">Aantal</label>
      <input type="number" class="form-control" id="amount" name="amount" placeholder="Bijv. 10" required min="1" />
      <div class="invalid-feedback"> Vul een geldig aantal in. </div>
    </div>

    <button type="submit" class="btn btn-dark w-100 mt-3">Toevoegen</button>
  </form>
</div>

{% endblock %}
