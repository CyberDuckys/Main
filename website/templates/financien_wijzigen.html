{% extends 'base.html' %}

{% block title %} Financiën Wijzigen {% endblock %}

{% block content %}
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='css/forms.css') }}">

<div class="container mt-5">
    <h1 class="text-center alignH1">Financiën Wijzigen</h1>

    <form method="post" action="{{ url_for('views.klantenlijst') }}" class="needs-validation" novalidate>

        <!-- Beschrijving -->
        <div class="mb-3">
            <label for="beschrijving" class="form-label">Beschrijving</label>
            <input type="text" class="form-control" id="beschrijving" name="beschrijving" value="{{ financien.beschrijving }}" required>
            <div class="invalid-feedback">Vul een beschrijving in.</div>
        </div>

        <!-- Bedrag -->
        <div class="mb-3">
            <label for="bedrag" class="form-label">Bedrag (€)</label>
            <input type="number" class="form-control" id="bedrag" name="bedrag" value="{{ financien.bedrag }}" step="0.01" required>
            <div class="invalid-feedback">Vul een geldig bedrag in.</div>
        </div>

        <!-- Status -->
        <div class="mb-3">
            <label for="status" class="form-label">Status</label>
            <select id="status" name="status" class="form-select" required>
                <option value="Onbetaald" {% if financien.status=='Onbetaald' %}selected{% endif %}>Onbetaald</option>
                <option value="Betaald" {% if financien.status=='Betaald' %}selected{% endif %}>Betaald</option>
            </select>
            <div class="invalid-feedback">Kies een status.</div>
        </div>

        <!-- Datum -->
        <div class="mb-3">
            <label for="datum" class="form-label">Datum</label>
            <input type="date" class="form-control" id="datum" name="datum" value="{{ financien.datum }}" required>
            <div class="invalid-feedback">Vul een geldige datum in.</div>
        </div>

        <!-- Verborgen ID -->
        <input type="hidden" name="id" value="{{ financien.id }}">

        <button type="submit" class="btn btn-dark w-100">Opslaan</button>
    </form>
</div>

<script>
    (function () {
        'use strict';
        var forms = document.querySelectorAll('.needs-validation');
        Array.prototype.slice.call(forms).forEach(function (form) {
            form.addEventListener('submit', function (event) {
                if (!form.checkValidity()) {
                    event.preventDefault();
                    event.stopPropagation();
                }
                form.classList.add('was-validated');
            }, false);
        });
    })();
</script>
{% endblock %}
