{% extends 'base.html' %} {% block title %} Voorraad {% endblock %} {% block head %}
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
<link rel="stylesheet" href="{{ url_for('static', filename='css/voorraadProductToevoegen.css') }}" />

{% endblock %} {% block content %}
<div class="container mt-5">
  <h1 class="text-center mb-4">Product Toevoegen</h1>
  <form method="POST" action="{{ url_for('views.voorraadProductToevoegen') }}" class="needs-validation" novalidate>
    <div class="mb-3">
      <label for="id" class="form-label">ID</label>
      <input type="text" class="form-control" id="id" name="id" placeholder="Bijv. 00005" required />
      <div class="invalid-feedback"> Vul een geldig ID in. </div>
    </div>
    <div class="mb-3">
      <label for="product" class="form-label">Product</label>
      <input type="text" class="form-control" id="product" name="product" placeholder="Bijv. Mango" required />
      <div class="invalid-feedback"> Vul een productnaam in. </div>
    </div>
    <div class="mb-3">
      <label for="batchnumber" class="form-label">Batchnummer</label>
      <input type="text" class="form-control" id="batchnumber" name="batchnumber" placeholder="Bijv. 00005" required />
      <div class="invalid-feedback"> Vul een batchnummer in. </div>
    </div>
    <div class="mb-3">
      <label for="storageadvice" class="form-label">Bewaaradvies</label>
      <input type="text" class="form-control" id="storageadvice" name="storageadvice" placeholder="Bijv. Koeling" required />
      <div class="invalid-feedback"> Vul een bewaaradvies in. </div>
    </div>
    <div class="mb-3">
      <label for="location" class="form-label">Locatie</label>
      <input type="text" class="form-control" id="location" name="location" placeholder="Bijv. A12" required />
      <div class="invalid-feedback"> Vul een locatie in. </div>
    </div>
    <div class="mb-3">
      <label for="amount" class="form-label">Aantal</label>
      <input type="number" class="form-control" id="amount" name="amount" placeholder="Bijv. 10" required />
      <div class="invalid-feedback"> Vul een aantal in. </div>
    </div>
    <button type="submit" class="btn btn-primary">Toevoegen</button>
  </form>
</div>

{% endblock %}
