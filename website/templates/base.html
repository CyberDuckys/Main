<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Favicon -->
  <link rel="apple-touch-icon" sizes="180x180"
    href="{{ url_for('static', filename='img/favicon_io/apple-touch-icon.png') }}">
  <link rel="icon" type="image/png" sizes="32x32"
    href="{{ url_for('static', filename='img/favicon_io/favicon-32x32.png') }}">
  <link rel="icon" type="image/png" sizes="16x16"
    href="{{ url_for('static', filename='img/favicon_io/favicon-16x16.png') }}">
  <link rel="shortcut icon" href="{{ url_for('static', filename='img/favicon_io/favicon.ico') }}">

  <title>{% block title %}Dashboard{% endblock %}</title>


  <!-- CSS -->
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

</head>

<body>

  <div class="sidebar">
    <a href="{{ url_for('views.index') }}"><i class="fas fa-home"></i>Dashboard</a>
    <a href="#"><i class="fas fa-box"></i>Voorraad</a>
    <a href="#"><i class="fas fa-shopping-cart"></i>Inkoop</a>
    <a href="{{ url_for('views.klanten') }}"><i class="fas fa-user"></i>Klant</a>
    <a href="{{ url_for('views.koeriers') }}"><i class="fas fa-truck"></i>Koeriers</a>
  </div>

  <div class="dashboard">
  {% block content %}

  {% endblock %}
  </div>
</body>
<!-- Js -->
<script src="{{ url_for('static', filename='js/script.js') }}"></script>

<script src="https://code.jquery.com/jquery-3.3.1.slim.min.js"
  integrity="sha384-q8i/X+965DzO0rT7abK41JStQIAqVgRVzpbzo5smXKp4YfRvH+8abtTE1Pi6jizo" crossorigin="anonymous"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.14.7/umd/popper.min.js"
  integrity="sha384-UO2eT0CpHqdSJQ6hJty5KVphtPhzWj9WO1clHTMGa3JDZwrnQq4sF86dIHNDz0W1" crossorigin="anonymous"></script>
<script src="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/js/bootstrap.min.js"
  integrity="sha384-JjSmVgyd0p3pXB1rRibZUAYoIIy6OrQ6VrjIEaFf/nJGzIxFDsf4x0xIM+B07jRM" crossorigin="anonymous"></script>

</html>
