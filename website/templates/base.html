<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Favicon -->
  <link rel="apple-touch-icon" sizes="180x180"
    href="{{ url_for('static', filename='img/favicon_io/apple-touch-icon.png') }}">
  <link rel="icon" type="image/png" sizes="32x32"
    href="{{ url_for('static', filename='img/favicon_io/favicon-32x32.png') }}">
  <link rel="icon" type="image/png" sizes="16x16"
    href="{{ url_for('static', filename='img/favicon_io/favicon-16x16.png') }}">
  <link rel="shortcut icon" href="{{ url_for('static', filename='img/favicon_io/favicon.ico') }}">

  <!-- Title -->
  <title>{% block title %} {% endblock %}</title>

  <!-- Bootstrap CSS -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">

  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

  <!-- Custom CSS -->
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

  {% block head %}{% endblock %}
</head>

<body>

    <div class="d-flex">
      <!-- Sidebar -->
      <div class="bg-dark text-white vh-100 p-3">
        <h3 class="text-center">Dashboard Menu</h3>
        <ul class="nav flex-column">
          <li class="nav-item">
            <a class="btn btn-dark w-100 text-start mb-2" href="{{ url_for('views.index') }}">
              <i class="fas fa-home"></i> Dashboard
            </a>
          </li>
          <li class="nav-item">
            <a class="btn btn-dark w-100 text-start mb-2" href="{{ url_for('views.voorraad') }}">
              <i class="fas fa-box"></i> Voorraad
            </a>
          </li>
          <li class="nav-item">
            <a class="btn btn-dark w-100 text-start mb-2" href="{{ url_for('views.inkoop') }}">
              <i class="fas fa-shopping-cart"></i> Inkoop
            </a>
          </li>
          <li class="nav-item">
            <a class="btn btn-dark w-100 text-start mb-2" href="{{ url_for('views.klantenlijst') }}">
              <i class="fas fa-user"></i> Klanten
            </a>
          </li>
          <li class="nav-item">
            <a class="btn btn-dark w-100 text-start" href="{{ url_for('views.koeriers') }}">
              <i class="fas fa-truck"></i> Koeriers
            </a>
          </li>
        </ul>
      </div>
    
      <!-- Dashboard Content -->
      <div class="flex-grow-1 p-4">
        {% block content %}
        {% endblock %}
      </div>
    </div>

  <!-- JS Libraries -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script src="{{ url_for('static', filename='script.js') }}"></script>
  <script src="{{ url_for('static', filename='js/newPrice.js') }}"></script>
  <script src="{{ url_for('static', filename='js/saveAll.js') }}"></script>
  {% block scripts %}{% endblock %}
</body>

</html>
